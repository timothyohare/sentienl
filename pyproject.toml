[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sentinel"
version = "1.0.0"
description = "Geopolitical signal monitoring system"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "flask>=3.1.3",
    "yfinance>=0.2.40",
    "requests>=2.33.0",
    "alpaca-py>=0.29.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["sentinel"]
omit = ["tests/*", "sentinel/scripts/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# sys.path.insert(...) must precede the sentinel.* imports it enables, for
# these standalone-entrypoint scripts — imports can't move to the top.
"sentinel/collectors/*_runner.py" = ["E402"]
"sentinel/dispatcher/alerter_runner.py" = ["E402"]
# Embedded HTML/CSS/Jinja template string — long lines are inherent to markup,
# not a readability problem the E501 line-length rule is meant to catch here.
"sentinel/dashboard/app.py" = ["E501"]

[tool.mypy]
ignore_missing_imports = true

[tool.mutmut]
source_paths = ["sentinel"]
# Thin wiring, not logic: entrypoint scripts (matches coverage's own
# sentinel/scripts/* omit) and the *_runner.py main()-only wrappers. Neither
# has (or is expected to have) dedicated unit tests — mutating them just
# produces unkillable noise that drags the score down without pointing at
# anything worth writing a test for.
do_not_mutate = ["sentinel/scripts/*", "*_runner.py"]
